<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron Sparkle Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f5f5f5;
      }

      .card {
        width: 360px;
        padding: 24px;
        border-radius: 16px;
        background: white;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
        text-align: center;
      }

      button {
        margin-top: 18px;
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: none;
        background-color: #007aff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:disabled {
        background-color: #8cb9ff;
        cursor: default;
      }

      .status {
        margin-top: 16px;
        color: #333;
        font-size: 14px;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Electron Sparkle Demo</h1>
      <p>Use the bundled `libMacSparkle.dylib` to trigger Sparkle from Electron.</p>
      <button id="checkButton">Check for Update</button>
      <div class="status" id="status">Ready</div>
    </div>

    <script>
      const button = document.getElementById('checkButton');
      const status = document.getElementById('status');

      if (!button || !status) {
        throw new Error('Expected UI elements are missing');
      }

      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = 'Checking for updates...';

        try {
          const success = window.api.checkForUpdate();
          status.textContent = success ? 'Update check launched.' : 'Update check failed.';
        } catch (error) {
          status.textContent = `Error: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
